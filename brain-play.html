<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brain Challenge</title><link rel="stylesheet" href="style.css"></head><body><header><a class="header-link" href="brain-games.html">← Brain Games</a><div class="brand"><span class="brand-mark">🧠</span><span id="gameName">BRAIN CHALLENGE</span></div><span></span></header><main><section class="panel brain-panel"><div class="player"><b id="round">Question 1 / 10</b><small id="score">Score: 0</small></div><div class="brain-meta"><span id="difficultyName">NORMAL</span><span>⏱ <b id="timer">20</b>s</span><span>⭐ <b id="stars">0</b></span></div><div class="progress-track"><div id="progressFill"></div></div><div class="challenge-icon" id="challengeIcon">🧠</div><div class="eyebrow" id="category">THINK FAST</div><h2 id="question">Loading…</h2><div id="choices" class="choice-grid"></div><label for="answer">OR TYPE YOUR ANSWER</label><input id="answer" autocomplete="off" placeholder="Type answer"><div class="tools"><button class="btn primary" id="check">Submit Answer</button><button class="btn" id="next" disabled>Next</button></div><p id="feedback" role="status"></p><button class="btn ghost" id="restart" style="width:100%">Restart Round</button><p class="hint">Fast correct answers earn more stars. Best score is saved on this device.</p></section></main><script type="module" src="js/brain-play.js"></script></body></html>
