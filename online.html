<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Online Chess - Chess Puzzle Master</title><link rel="stylesheet" href="style.css"></head><body><header><h1>♟ Online Multiplayer</h1><p>Play with a friend using a room code</p></header><main><section class="panel"><h2>Online Room</h2><div class="tools"><button id="create" class="primary">Create Room</button><button id="join">Join Room</button></div><input id="roomCode" maxlength="6" placeholder="Enter 6-digit room code" style="width:100%;margin-top:12px;padding:13px;border-radius:9px;background:#100e0c;color:white;border:1px solid #6d553b;text-transform:uppercase"><p id="onlineStatus" role="status">Sign in anonymously to start.</p><div class="player"><b id="opponent">Waiting for opponent</b><small id="myColor">Not connected</small></div><div id="onlineBoard" style="width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);border:5px solid #68492a"></div><p id="turn" style="color:#e1c58e"></p><div class="tools"><button id="resign">Resign</button><button id="leave">Leave Room</button></div><p class="hint">Both players need internet and must have Anonymous sign-in enabled in Firebase Authentication. Share the room code with your friend.</p><a href="index.html" style="color:#e1c58e">← Back to Chess</a></section></main><script type="module" src="js/online.js"></script></body></html>
