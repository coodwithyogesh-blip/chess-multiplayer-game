<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Play vs Computer - Chess Puzzle Master</title><link rel="stylesheet" href="style.css"></head><body><header><a class="header-link" href="index.html">← Home</a><div class="brand"><span class="brand-mark">♞</span><span>VS COMPUTER</span></div><span></span></header><main><div class="eyebrow">SINGLE PLAYER</div><h1 class="page-title">Your next move.</h1><div class="game-layout"><section><div class="player-tag"><b>♚ Computer · Black</b><small>AI opponent</small></div><div class="board-shell"><div id="board" aria-label="Chess board"></div></div><div class="player-tag"><b>♔ You · White</b><small id="difficultyLabel">Medium</small></div></section><aside class="game-side"><h2>New match</h2><label for="difficulty">BOT DIFFICULTY</label><select id="difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option><option value="grandmaster">Grandmaster</option></select><button id="start" class="btn primary" style="width:100%;margin-top:12px">Start game</button><div id="status" class="game-status" role="status">Choose difficulty and start.</div><div class="tools"><button id="undo" class="btn">Undo</button><button id="hint" class="btn">Hint</button><button id="restart" class="btn">Restart</button></div><p class="hint">Tap a piece, then tap a highlighted square. You play White.</p></aside></div></main><script type="module" src="js/app.js"></script></body></html>
