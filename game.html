<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11102b"><title>Live Chess Match</title><link rel="stylesheet" href="style.css"></head>
<body class="online-theme"><header><a class="header-link" href="index.html">← Exit</a><div class="brand"><span class="brand-mark">♞</span><span>LIVE ARENA</span></div><div class="header-tools"><span id="myColor" class="header-link">Connecting…</span><button class="music-toggle" id="musicToggle">♫ Music: OFF</button></div></header>
<main><div class="game-layout"><section class="online-board-area"><div class="player-tag opponent-tag"><b id="opponent">Opponent</b><small>⚫ Online</small></div><div class="board-shell"><div id="onlineBoard" aria-label="Online chess board"></div></div><div class="player-tag"><b id="mySide">You</b><small id="turn">Waiting for game…</small></div><div class="turn-banner" id="turnBanner">Connecting to room…</div></section><aside class="game-side online-side"><div class="eyebrow">✦ PRIVATE MATCH</div><h2>Game room</h2><div id="onlineStatus" class="game-status" role="status">Connecting…</div><div class="tools"><button id="resign" class="btn">Resign</button><button id="leave" class="btn">Leave</button></div><p class="hint">Tap your piece, then its highlighted destination. White and Black must take turns. You cannot move twice in a row.</p><div class="turn-rules"><b>♔ White</b><span>↓</span><b>♚ Black</b><span>↓</span><b>♔ White again</b></div></aside></div></main><script type="module" src="js/online.js"></script></body></html>
